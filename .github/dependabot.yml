version: 2
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.GH_PACKAGES_READ_TOKEN}}
updates:
  - package-ecosystem: npm
    directory: /
    registries:
      - github-packages
    schedule:
      interval: weekly
    allow:
      - dependency-name: "@cloudkid-labs/sda-church-site-core"
        dependency-type: direct
