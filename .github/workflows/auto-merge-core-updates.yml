name: Auto-merge compatible core updates

on:
  workflow_run:
    workflows: [Build Struisbaai site]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const associated = run.pull_requests?.[0];
            if (!associated) return;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: associated.number,
            });
            if (pr.user.login !== 'dependabot[bot]') return;
            const match = pr.title.match(/^Bump @cloudkid-labs\/sda-church-site-core from (\d+)\.(\d+)\.(\d+) to (\d+)\.(\d+)\.(\d+)/i);
            if (!match) {
              core.info('This Dependabot PR does not update the shared core package.');
              return;
            }
            const [, oldMajor, oldMinor, oldPatch, newMajor] = match;
            if (oldMajor !== newMajor) {
              core.info('Major core updates stay open for church review.');
              return;
            }
            const { repository: { pullRequest } } = await github.graphql(
              `query($owner:String!, $name:String!, $number:Int!) {
                repository(owner:$owner, name:$name) {
                  pullRequest(number:$number) { id }
                }
              }`,
              { owner: context.repo.owner, name: context.repo.repo, number: pr.number },
            );
            await github.graphql(
              `mutation($id:ID!) {
                enablePullRequestAutoMerge(input:{pullRequestId:$id, mergeMethod:SQUASH}) {
                  pullRequest { number }
                }
              }`,
              { id: pullRequest.id },
            );
            core.info(`Auto-merge enabled for compatible core update ${oldMajor}.${oldMinor}.${oldPatch}.`);
