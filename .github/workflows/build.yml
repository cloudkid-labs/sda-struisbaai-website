name: Build Struisbaai site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN || github.token }}
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          PUBLIC_INDEXABLE: 'false'
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://sdastruisbaai.co.za' }}
          PUBLIC_APP_COMMIT: ${{ github.sha }}
