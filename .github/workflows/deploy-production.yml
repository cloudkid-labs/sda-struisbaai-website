name: Deploy Struisbaai production (Cloudflare)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: struisbaai-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN || github.token }}

      - name: Test
        run: npm test

      - name: Build production
        run: npm run build
        env:
          PUBLIC_INDEXABLE: 'true'
          PUBLIC_SITE_URL: 'https://sdastruisbaai.co.za'
          PUBLIC_APP_COMMIT: ${{ github.sha }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
